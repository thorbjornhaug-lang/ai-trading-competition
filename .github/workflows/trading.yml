name: hourly-paper-trading
on:
  schedule:
    - cron: "7 * * * *"   # every hour (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:
    inputs:
      restart_from:
        description: "Restart the competition from this UTC time (YYYY-MM-DD HH:MM). Leave empty for a normal hourly run."
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: paper-trading
  cancel-in-progress: false
jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          if [ -n "${{ inputs.restart_from }}" ]; then
            python paper.py --reset --start "${{ inputs.restart_from }}"
          else
            python paper.py
          fi
      - run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add state LEADERBOARD.md docs
          git commit -m "Paper trading update $(date -u '+%F %H:%M')" || exit 0
          git pull --rebase origin main
          git push
