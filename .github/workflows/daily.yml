name: daily-paper-trading
on:
  schedule:
    - cron: "30 22 * * 1-5"   # after US close; crypto weekend bars are caught up on Monday
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python paper.py
      - run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add state LEADERBOARD.md
          git commit -m "Paper trading update $(date -u +%F)" || exit 0
          git push
